[project]
name = "saude-br"
version = "0.1.0"
description = "Gasto federal em saúde no Brasil por governo (2000–2026) — app Streamlit"
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "plotly>=5.24",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
